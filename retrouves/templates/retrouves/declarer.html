{% extends "retrouves/base.html" %}
{% block titre %}Déclarer un document trouvé{% endblock %}

{% block contenu %}
<h1 class="mb-3">J'ai trouvé un document</h1>
<p>Déposez le document au poste de police du département choisi, puis remplissez ce formulaire.</p>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Enregistrer le document</button>
</form>
{% endblock %}
